[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spendtab"
version = "0.3.0"
description = "Spend audit and budget guard for Claude Code sessions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SpendTab contributors" }]
keywords = ["claude-code", "cost", "tokens", "observability", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
spendtab = "spendtab.cli:main"

[tool.setuptools]
packages = ["spendtab"]
